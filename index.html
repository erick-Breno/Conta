<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CBMMA 2026 | Contagem Regressiva</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Efeito de fundo -->
    <div class="background-glow"></div>

    <main class="container">

        <!-- Cabeçalho -->
        <header class="header">

            <div class="emblem">
                <span>🔥</span>
            </div>

            <div>
                <p class="institution">CORPO DE BOMBEIROS MILITAR</p>
                <h1>CBMMA <span>2026</span></h1>
            </div>

        </header>


        <!-- Conteúdo principal -->
        <section class="hero">

            <p class="label">CONTAGEM REGRESSIVA</p>

            <h2>
                O RESULTADO ESTÁ<br>
                <span>CHEGANDO.</span>
            </h2>


            <!-- Contador -->
            <div class="countdown">

                <div class="time-card days-card">
                    <span id="days">00</span>
                    <small>DIAS</small>
                </div>

                <div class="separator">:</div>

                <div class="time-card">
                    <span id="hours">00</span>
                    <small>HORAS</small>
                </div>

                <div class="separator">:</div>

                <div class="time-card">
                    <span id="minutes">00</span>
                    <small>MINUTOS</small>
                </div>

                <div class="separator seconds-separator">:</div>

                <div class="time-card seconds-card">
                    <span id="seconds">00</span>
                    <small>SEGUNDOS</small>
                </div>

            </div>


            <!-- Data da prova -->
            <div class="exam-info">

                <div class="info-item">
                    <span class="icon">📅</span>

                    <div>
                        <strong>17 DE NOVEMBRO DE 2026</strong>
                        <small>DATA DA PROVA</small>
                    </div>
                </div>

                <div class="line"></div>

                <div class="info-item">
                    <span class="icon">🕐</span>

                    <div>
                        <strong>ATÉ AS 19:00</strong>
                    </div>
                </div>

            </div>


            <!-- Aviso -->
            <div class="notice">
                <span>⚠</span>

            </div>

        </section>


        <!-- Rodapé -->
        <footer>

            <div class="fire-line"></div>

            <p>
                <strong>SEJA O QUE DEUS QUISER</strong>
            </p>

            <span>
                Rumo à aprovação no CBMMA 2026
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
